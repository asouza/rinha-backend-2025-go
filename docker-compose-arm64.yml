version: '3.8'

services:
  nginx:
    image: nginx:alpine
    platform: linux/arm64
    container_name: rinha-nginx-arm64
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
    networks:
      - rinha-network
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "50MB"

  web1:
    build:
      context: .
      dockerfile: Dockerfile.arm64
    platform: linux/arm64
    container_name: rinha-web1-arm64
    hostname: web1
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=rinha
      - PAYMENT_URLS=http://payment-processor-default:8080/payments,http://payment-processor-fallback:8080/payments
    networks:
      - rinha-network
      - payment-processor
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: "120MB"

  web2:
    build:
      context: .
      dockerfile: Dockerfile.arm64
    platform: linux/arm64
    container_name: rinha-web2-arm64
    hostname: web2
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=rinha
      - PAYMENT_URLS=http://payment-processor-default:8080/payments,http://payment-processor-fallback:8080/payments
    networks:
      - rinha-network
      - payment-processor
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: "120MB"

  postgres:
    image: postgres:17-alpine
    platform: linux/arm64
    container_name: rinha-postgres-arm64
    hostname: postgres
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=rinha
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - rinha-network
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "60MB"

networks:
  rinha-network:
    driver: bridge
  payment-processor:
    external: true
    name: payment-processor